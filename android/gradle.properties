# Project-wide Gradle settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Don't set org.gradle.java.home here — it's machine-specific and breaks CI and other PCs.
# Pick the JDK in Android Studio (Settings > Build Tools > Gradle > Gradle JDK) or in
# your personal ~/.gradle/gradle.properties instead.
