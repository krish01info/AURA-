name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Adds a "Run workflow" button on the Actions tab (e.g. after changing repo secrets)
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      HAS_GROQ_KEY: ${{ secrets.GROQ_API_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Create local.properties
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Keys come from repo secrets (Settings > Secrets and variables > Actions).
          # Empty if unset — the app then needs a key typed into its Settings screen.
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> android/local.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> android/local.properties
          # Optional community skill store (empty = app works offline, nothing uploaded).
          echo "SUPABASE_URL=$SUPABASE_URL" >> android/local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> android/local.properties

      # Groq retires models often — warn on the PR if one AURA uses is gone.
      - name: Check Groq models are still available
        if: env.HAS_GROQ_KEY == 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ids=$(curl -fsS -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models | jq -r '.data[].id') \
            || { echo "::warning title=Groq::The GROQ_API_KEY secret was rejected or Groq is unreachable"; exit 0; }
          models=$(grep -oE '^[[:space:]]*"[^"]+"[[:space:]]+to' android/app/src/main/java/com/aura/llm/GroqClient.kt | grep -oE '"[^"]+"' | tr -d '"')
          for m in $models; do
            if grep -qx "$m" <<<"$ids"; then echo "OK: $m"
            else echo "::warning title=Groq model missing::$m is no longer available on Groq — update MODEL_CASCADE in llm/GroqClient.kt"; fi
          done

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Re-post compiler / Gradle errors as annotations so they show on the PR
      # (and can be read via the API) without opening the full log.
      - name: Report build errors
        if: failure()
        working-directory: android
        shell: bash
        run: |
          if [ -f build.log ]; then
            # GitHub keeps max 10 error annotations per step: pack 6 lines into each.
            grep -E '^e: |What went wrong|Execution failed|^> |error:|Exception|Could not|not found|Unresolved' build.log \
              | grep -v '^[[:space:]]*at ' | awk '!seen[$0]++' | head -54 \
              | cut -c1-400 | sed 's/%/%25/g' \
              | awk '{ buf = (NR % 6 == 1) ? $0 : buf "%0A" $0 } NR % 6 == 0 { print buf; buf="" } END { if (buf != "") print buf }' \
              | while IFS= read -r chunk; do echo "::error title=Build error::${chunk}"; done
          fi

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Room writes android/app/schemas/<db>/<version>.json during the build. A new one
      # must be committed (the next AutoMigration needs it) — warn and publish it.
      - name: Check Room schema is committed
        if: always()
        shell: bash
        run: |
          new=$(git status --porcelain -- android/app/schemas | awk '{print $2}')
          if [ -n "$new" ]; then
            for f in $new; do echo "::warning title=Room schema not committed::$f — download the room-schemas artifact and commit it"; done
          fi

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7
