name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Create local.properties (CI stub — no real keys needed for build)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "GROQ_API_KEY=" >> android/local.properties

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Re-post compiler / Gradle errors as annotations so they show on the PR
      # (and can be read via the API) without opening the full log.
      - name: Report build errors
        if: failure()
        working-directory: android
        shell: bash
        run: |
          if [ -f build.log ]; then
            # GitHub keeps max 10 error annotations per step: pack 6 lines into each.
            grep -E '^e: |What went wrong|Execution failed|^> |error:|Exception|Could not|not found|Unresolved' build.log \
              | grep -v '^[[:space:]]*at ' | awk '!seen[$0]++' | head -54 \
              | cut -c1-400 | sed 's/%/%25/g' \
              | awk '{ buf = (NR % 6 == 1) ? $0 : buf "%0A" $0 } NR % 6 == 0 { print buf; buf="" } END { if (buf != "") print buf }' \
              | while IFS= read -r chunk; do echo "::error title=Build error::${chunk}"; done
          fi

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7
