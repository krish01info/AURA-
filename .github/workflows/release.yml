name: Release APK

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO RELEASE:
#
#   1. Bump versionName in android/app/build.gradle.kts  (e.g. "0.2.0")
#   2. Bump versionCode by 1
#   3. Commit:  git commit -am "chore: bump version to 0.2.0"
#   4. Tag:     git tag v0.2.0
#   5. Push:    git push && git push --tags
#
#   GitHub Actions will automatically:
#     - Build the signed release APK
#     - Create a GitHub Release named "AURA v0.2.0"
#     - Upload the APK as a release asset
#
#   Every installed AURA device will detect the new release on next app open
#   and show a "Download & Install" notification.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'          # triggers on v0.1.0, v0.2.0, v1.0.0, etc.

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle permissions ─────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── 4. Inject secrets into local.properties ───────────────────────────
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> android/local.properties

      # ── 5. Create keystore from secret ────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/aura-release.keystore

      # ── 6. Build signed release APK ───────────────────────────────────────
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/aura-release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      # ── 7. Rename APK to include version tag ─────────────────────────────
      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/aura-${VERSION}.apk
          echo "APK_PATH=android/app/build/outputs/apk/release/aura-${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ── 8. Extract release notes from CHANGELOG or use tag annotation ─────
      - name: Get release notes
        id: notes
        run: |
          # Try to read from CHANGELOG.md first; fall back to generic message
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            NOTES=$(awk "/^## \[${{ github.ref_name }}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md | head -50)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="AURA ${{ github.ref_name }} — see commit history for changes."
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 9. Create GitHub Release + upload APK ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AURA ${{ env.VERSION }}"
          body: ${{ steps.notes.outputs.notes }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. Clean up keystore ─────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f android/app/aura-release.keystore
