name: Release APK

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO RELEASE — just 4 commands:
#
#   1. Bump versionCode + versionName in android/app/build.gradle.kts
#   2. git add -A
#   3. git commit -m "release: v0.2.0"
#   4. git tag v0.2.0
#   5. git push && git push --tags
#
#   GitHub builds the APK automatically and publishes it as a Release.
#   No secrets, no keystore, no setup needed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "GROQ_API_KEY=" >> android/local.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/aura-${VERSION}.apk
          echo "APK=android/app/build/outputs/apk/debug/aura-${VERSION}.apk" >> $GITHUB_ENV

      - name: Get release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(awk "/^## \[${TAG}\]/{found=1;next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="AURA ${TAG}"; fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AURA ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          files: ${{ env.APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
