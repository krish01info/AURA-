name: Release APK

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO RELEASE
#
#   1. Bump versionCode + versionName in android/app/build.gradle.kts
#   2. Add a "## [vX.Y.Z] - date" section to CHANGELOG.md (becomes the release notes)
#   3. Merge to main, then push the tag:  git tag vX.Y.Z && git push origin vX.Y.Z
#      (or Actions → Release APK → Run workflow and type the tag)
#
#   GitHub builds a shrunk RELEASE APK signed with the permanent AURA key and publishes it.
#   Phones see it through the in-app update check and install it over the old version.
#   Required secrets: AURA_KEYSTORE_BASE64, AURA_KEYSTORE_PASSWORD.
#   Optional: GROQ_API_KEY, GEMINI_API_KEY, SUPABASE_URL, SUPABASE_ANON_KEY (baked into the APK).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0)'
        required: true
        default: 'v0.2.0'

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create local.properties
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Keys come from repo secrets (Settings > Secrets and variables > Actions).
          # Empty if unset — the app then needs a key typed into its Settings screen.
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> android/local.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> android/local.properties
          echo "SUPABASE_URL=$SUPABASE_URL" >> android/local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> android/local.properties

      # A release must be signed with the permanent key, or phones can't install it as an update.
      - name: Signing key
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$AURA_KEYSTORE_BASE64" ]; then
            echo "::error title=No signing key::Add the AURA_KEYSTORE_BASE64 and AURA_KEYSTORE_PASSWORD repo secrets first"
            exit 1
          fi
          echo "$AURA_KEYSTORE_BASE64" | base64 -d > android/aura-release.jks
          echo "AURA_KEYSTORE_FILE=aura-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "$VERSION" = "main" ] || [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/aura-${VERSION}.apk
          echo "APK=android/app/build/outputs/apk/release/aura-${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Get release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ env.VERSION }}"
          NOTES=$(awk "/^## \[${TAG}\]/{found=1;next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="AURA ${TAG}"; fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AURA ${{ env.VERSION }}"
          tag_name: "${{ env.VERSION }}"
          body: ${{ steps.notes.outputs.body }}
          files: ${{ env.APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
